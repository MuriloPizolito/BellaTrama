spring:
  application:
    name: bellatrama

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

logging:
  pattern:
    console: '%d{dd-MM-yyyy HH:mm:ss} %5p [%t] %-40.40logger : %m%n'
